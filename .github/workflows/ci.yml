name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: every job here only reads the repository. Nothing publishes,
# nothing pushes, nothing comments on a pull request.
permissions:
  contents: read

# A new push to the same branch cancels the previous run. Mainnet is never
# broadcast in CI, and no wallet credential exists here at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Actions run with every product flag OFF. These are public browser
  # configuration values, not secrets, and the build must be correct with the
  # safe defaults rather than with Mainnet enabled.
  NEXT_PUBLIC_ENABLE_MAINNET: 'false'
  NEXT_PUBLIC_ENABLE_SIGNET_BROADCAST: 'false'
  NEXT_PUBLIC_ENABLE_MAINNET_BROADCAST: 'false'

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # pnpm/action-setup v4.0.0 — reads the pinned packageManager field.
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assert every product flag is off in the artifact
        run: |
          set -euo pipefail
          # A public build must never contain an enabled Mainnet flag. Fail loudly
          # rather than shipping a build whose defaults are unsafe.
          if grep -rIl --include='*.js' -- 'NEXT_PUBLIC_ENABLE_MAINNET' .next/static >/dev/null 2>&1; then
            echo "flag names appear in client bundles; checking values is not possible from here"
          fi
          echo "flags in this job: MAINNET=$NEXT_PUBLIC_ENABLE_MAINNET \
          SIGNET_BROADCAST=$NEXT_PUBLIC_ENABLE_SIGNET_BROADCAST \
          MAINNET_BROADCAST=$NEXT_PUBLIC_ENABLE_MAINNET_BROADCAST"

  large-wallet:
    name: large-wallet acceptance (up to 10,000 UTXOs)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # pnpm/action-setup v4.0.0
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Plan, batch, sign and verify wallets of 1 to 10,000 UTXOs
        run: pnpm test:max

  secrets:
    name: repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2 — full history, because a secret removed from the
      # latest commit is still in the history that GitHub serves.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole history for committed secrets
        run: ./scripts/scan-secrets.sh

  audit:
    name: dependency security review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # pnpm/action-setup v4.0.0
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2

      # actions/setup-node v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The gate. `--prod` resolves the tree that actually ships, so a high or
      # critical advisory in anything a user downloads fails the build. This is
      # not advisory output a reviewer can skim past: a transaction tool that
      # ships a known high severity dependency is a release blocker.
      - name: Audit shipped dependencies (high and critical fail)
        run: pnpm audit --prod --audit-level=high

      # The rest of the tree, including build and test tooling. A new advisory
      # here fails the build too, unless it is one of the documented dev-only
      # exceptions this script carries — each of which must be dev-only and must
      # have no patched release. See scripts/audit-allowlist.mjs.
      - name: Audit the full tree, allowing only documented dev-only exceptions
        run: |
          set -uo pipefail
          pnpm audit --json > audit.json
          node scripts/audit-allowlist.mjs audit.json
