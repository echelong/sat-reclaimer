name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: every job here only reads the repository. Nothing publishes,
# nothing pushes, nothing comments on a pull request.
permissions:
  contents: read

# A new push to the same branch cancels the previous run. Mainnet is never
# broadcast in CI, and no wallet credential exists here at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Actions run with every product flag OFF. These are public browser
  # configuration values, not secrets, and the build must be correct with the
  # safe defaults rather than with Mainnet enabled.
  NEXT_PUBLIC_ENABLE_MAINNET: 'false'
  NEXT_PUBLIC_ENABLE_SIGNET_BROADCAST: 'false'
  NEXT_PUBLIC_ENABLE_MAINNET_BROADCAST: 'false'

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup v6.1.0 — reads the pinned packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Assert every product flag is off in the artifact
        run: node scripts/check-safe-artifact.mjs

  browser:
    name: production browser acceptance (fixtures only)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Rebuild plan and testnet modes; isolated browser provider and node
      # fixtures intercept every external request. Mainnet stays disabled.
      - run: pnpm test:browser

  large-wallet:
    name: large-wallet acceptance (up to 10,000 UTXOs)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Plan, batch, sign and verify wallets of 1 to 10,000 UTXOs
        run: pnpm test:max

  secrets:
    name: repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1 — full history, because a secret removed from the
      # latest commit is still in the history that GitHub serves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the whole history for committed secrets
        run: ./scripts/scan-secrets.sh

  audit:
    name: dependency security review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # pnpm/action-setup v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The gate. `--prod` resolves the tree that actually ships, so a high or
      # critical advisory in anything a user downloads fails the build. This is
      # not advisory output a reviewer can skim past: a transaction tool that
      # ships a known high severity dependency is a release blocker.
      - name: Audit shipped dependencies (high and critical fail)
        run: pnpm audit --prod --audit-level=high

      # The rest of the tree, including build and test tooling. A new advisory
      # here fails the build too, unless it is one of the documented dev-only
      # exceptions this script carries — each of which must be dev-only and must
      # have no patched release. See scripts/audit-allowlist.mjs.
      - name: Audit the full tree, allowing only documented dev-only exceptions
        run: |
          set -uo pipefail
          # `pnpm audit` exits non-zero whenever it has anything to report, which is
          # also its normal output here, so the status is intentionally ignored:
          # scripts/audit-allowlist.mjs reads the report and decides what fails.
          # Without the `|| true` the runner's inherited `bash -e` aborts the step
          # before that decision is ever made.
          pnpm audit --json > audit.json || true
          node scripts/audit-allowlist.mjs audit.json
